{% extends 'base.html' %}

{% block head %}
<title>상품 수정</title>
<style>
    main {
        min-height: 100vh;
        padding: 40px;
    }

    .post-form {
        max-width: 720px;
        margin: 0 auto;
    }

    #ocr-status {
        display: none;
        margin: 12px 0;
        font-weight: bold;
    }
</style>
{% endblock %}

{% block content %}
<form
    class="post-form"
    action="{% url 'posts:update' post.pk %}"
    method="POST"
    enctype="multipart/form-data"
>
    {% csrf_token %}
    {{ form.as_p }}

    <p id="ocr-status"></p>

    <button class="btn btn-primary" type="submit">
        수정 완료
    </button>
</form>

<script>
    const nutritionInput =
        document.getElementById("id_nutrition_image");

    const statusElement =
        document.getElementById("ocr-status");

    function setStatus(message, isError = false) {
        statusElement.style.display = "block";
        statusElement.textContent = message;

        statusElement.className =
            isError ? "text-danger" : "text-success";
    }

    async function analyzeNutritionImage(file) {
        const formData = new FormData();

        formData.append(
            "nutrition_image",
            file
        );

        setStatus("분석 중…");

        try {
            const response = await fetch(
                "{% url 'posts:analyze_nutrition' %}",
                {
                    method: "POST",
                    headers: {
                        "X-CSRFToken":
                            document.querySelector(
                                "[name=csrfmiddlewaretoken]"
                            ).value,
                    },
                    body: formData,
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "영양성분 분석에 실패했습니다."
                );
            }

            document.getElementById(
                "id_calories"
            ).value = data.calories || "";

            document.getElementById(
                "id_carbohydrate"
            ).value = data.carbohydrate || "";

            document.getElementById(
                "id_protein"
            ).value = data.protein || "";

            document.getElementById(
                "id_fat"
            ).value = data.fat || "";

            if (data.warning) {
                setStatus(data.warning, true);
            } else {
                setStatus(
                    "분석 완료! 값을 확인하고 필요하면 수정해주세요."
                );
            }
        } catch (error) {
            setStatus(error.message, true);
        }
    }

    nutritionInput?.addEventListener(
        "change",
        function (event) {
            const file = event.target.files[0];

            if (file) {
                analyzeNutritionImage(file);
            }
        }
    );
</script>
{% endblock %}
